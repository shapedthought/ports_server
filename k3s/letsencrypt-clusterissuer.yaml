# letsencrypt-clusterissuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod # This name ('letsencrypt-prod') will be referenced in your Ingress
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: edward.x.howard@veeam.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - http01:
        ingress:
          class: traefik