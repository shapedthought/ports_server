# Plan C: build allports_updated.db (scrape + enrich + Voyage embeddings) off-box.
# Artifact can be downloaded and copied onto the VPS PVC when scrape shouldn't run on-cluster.
name: Build embeddings DB

on:
  workflow_dispatch:
  schedule:
    # Monday 07:00 UTC — after scraper window (06:00 UTC)
    - cron: "0 7 * * 1"

jobs:
  build-db:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # scrape_ports fails closed if Anthropic enrichment all-falls-back
      # (bad/unscoped key). Do not add --allow-enrichment-fallback here.
      - name: Scrape, enrich, and build Voyage embeddings
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scrape_ports.py --db allports_updated.db

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: allports-updated-db
          path: allports_updated.db
          retention-days: 30
